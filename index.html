<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de servicios mínimos</title>
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#0A2A66; --muted:#55617A; --line:#C9D1DF;
  --estr:#1F3F86; --ref:#0F8B8D; --baja:#A3ACBB; --huelga:#C8102E; --min:#E0A800; --ord:#2E7DD1; --accent:#FFCD00; --warn:#B3261E;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0E1626; --surface:#17223A; --ink:#E8EDF7; --muted:#9AA6BD; --line:#2C3A57;
    --estr:#7EA0E8; --ref:#3CC6C8; --baja:#5B6578; --huelga:#FF5C6C; --min:#FFD43B; --ord:#5AA9FF; --accent:#FFD43B; --warn:#FF8A80;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:620px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(1.35rem,5vw,1.8rem);font-weight:800;letter-spacing:-.01em;line-height:1.15;margin:0 0 14px}
.form{background:var(--surface);border:3px solid var(--accent);border-radius:16px;padding:16px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field label{font-weight:600}
.field small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.field input{width:84px;font:inherit;font-size:1.15rem;font-weight:700;text-align:center;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.field input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.result{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px;font-weight:700}
.result b{font-size:1.8rem;font-weight:900}
.err{color:var(--warn);font-weight:600;min-height:1.4em;margin:6px 0}
.stage{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:3px solid var(--accent);border-radius:16px;padding:10px}
.row{display:flex;gap:8px}
.row>.zone{flex:1}
.zone{border:2px dashed var(--line);border-radius:12px;padding:6px 6px 8px}
.zone.off{display:none}
.zone span{display:block;font-size:.85rem;font-weight:700;margin:0 0 4px 2px}
.z-pool{border-style:solid;border-color:transparent}
.z-min{border-color:var(--min)}
.z-ord{border-color:var(--ord)}
.z-baja{border-color:var(--baja)}
.z-hue{border-color:var(--huelga)}
.slots{display:flex;flex-wrap:wrap;gap:4px;min-height:20px}
.f{width:clamp(20px,6vw,32px);color:var(--estr);transition:color .5s}
.f.hidden{display:none}
.f svg{display:block;width:100%;height:auto}
.f .head{fill:currentColor;opacity:.6}
.f .body{fill:currentColor}
.f .bag{fill:var(--surface);opacity:.85}
.f.ref{color:var(--ref)}
.f.baja{color:var(--baja)}
.f.huelga{color:var(--huelga)}
.f.min{color:var(--min)}
.f.ord{color:var(--ord)}
.cap{min-height:160px;padding:16px 2px 4px}
.step{margin:0;font-size:.85rem;color:var(--muted)}
.cap h2{margin:4px 0 6px;font-size:clamp(1.15rem,4.4vw,1.4rem);font-weight:800}
.formula{margin:4px 0 8px;font-size:clamp(1.8rem,9vw,2.7rem);font-weight:900;letter-spacing:-.02em}
.formula[hidden]{display:none}
.txt{margin:0;font-size:1.05rem}
.txt.warn{color:var(--warn);font-weight:700}
.ctrl{display:flex;gap:10px;margin-top:12px}
button{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:10px;cursor:pointer;border:2px solid var(--ink);background:transparent;color:var(--ink)}
button.main{background:var(--ink);color:var(--surface)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.edit{margin-top:10px;width:100%;border-color:var(--line);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;list-style:none;padding:0;margin:18px 0 0;font-size:.9rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
[hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1>Calculadora de servicios mínimos</h1>

  <section id="formView" class="form">
    <div class="field"><label for="e">Plantilla estructural<small>Carteros de plantilla de la unidad</small></label><input id="e" type="number" inputmode="numeric" min="1" max="60" value="14"></div>
    <div class="field"><label for="b">De baja<small>Estructurales que no están disponibles</small></label><input id="b" type="number" inputmode="numeric" min="0" value="2"></div>
    <div class="field"><label for="r">Refuerzos<small>Incluidos los que sustituyen bajas</small></label><input id="r" type="number" inputmode="numeric" min="0" value="4"></div>
    <div class="result"><span>Plantilla activa</span><b id="activa">16</b></div>
    <div class="field"><label for="h">Hacen huelga<small>De la plantilla activa</small></label><input id="h" type="number" inputmode="numeric" min="0" value="4"></div>
    <p class="err" id="err" role="alert"></p>
    <button id="start" class="main" style="width:100%">Ver animación</button>
  </section>

  <section id="animView" hidden>
    <div class="stage" id="stage">
      <div class="zone z-pool" id="z-pool"><span>Unidad (trabajan normal)</span><div class="slots"></div></div>
      <div class="row">
        <div class="zone z-min off" id="z-min"><span>Servicios mínimos</span><div class="slots"></div></div>
        <div class="zone z-ord off" id="z-ord"><span>No huelguistas</span><div class="slots"></div></div>
      </div>
      <div class="row">
        <div class="zone z-baja off" id="z-baja"><span>De baja</span><div class="slots"></div></div>
        <div class="zone z-hue off" id="z-hue"><span>En huelga</span><div class="slots"></div></div>
      </div>
    </div>
    <div class="cap" aria-live="polite">
      <p class="step" id="step"></p>
      <h2 id="title"></h2>
      <p class="formula" id="formula" hidden></p>
      <p class="txt" id="txt"></p>
    </div>
    <div class="ctrl">
      <button id="prev">Anterior</button>
      <button id="next" class="main">Siguiente</button>
    </div>
    <button id="edit" class="edit">Cambiar datos</button>
    <ul class="legend">
      <li><i style="background:var(--estr)"></i>Estructural</li>
      <li><i style="background:var(--ref)"></i>Refuerzo</li>
      <li><i style="background:var(--baja)"></i>De baja</li>
      <li><i style="background:var(--huelga)"></i>En huelga</li>
      <li><i style="background:var(--min)"></i>Servicios mínimos</li>
      <li><i style="background:var(--ord)"></i>Trabajo ordinario</li>
    </ul>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const svg='<svg viewBox="0 0 40 56" aria-hidden="true"><path class="body" d="M10 11 Q20 1 30 11 L32 13 H8 Z"/><circle class="head" cx="20" cy="19" r="7.5"/><path class="body" d="M6 56 V37 Q6 28 20 28 Q34 28 34 37 V56 Z"/><rect class="bag" x="24" y="39" width="10" height="8" rx="2"/></svg>';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let D={}, figs=[], cur=0;

function num(id){const v=$(id).value.trim();return v===''?NaN:Number(v);}
function read(){
  const E=num('e'),B=num('b'),R=num('r'),H=num('h');
  const A=E-B+R;
  $('activa').textContent=Number.isFinite(A)&&A>=0?A:'–';
  let err='';
  if([E,B,R,H].some(x=>!Number.isInteger(x)||x<0)) err='Rellena todos los campos con números enteros.';
  else if(E<1) err='La plantilla estructural debe ser al menos 1.';
  else if(B>E) err='No puede haber más bajas que plantilla estructural.';
  else if(E+R>60) err='Máximo 60 personas entre estructurales y refuerzos.';
  else if(A<1) err='La plantilla activa debe ser al menos 1.';
  else if(H>A) err='No pueden hacer huelga más personas que la plantilla activa ('+A+').';
  return {E,B,R,H,A,err};
}
['e','b','r','h'].forEach(id=>$(id).addEventListener('input',()=>{$('err').textContent='';read();}));

function setup(d){
  const M=Math.ceil(d.E/2), P=d.A-d.H;
  D={...d,M,P,Mreal:Math.min(M,P),O:Math.max(P-M,0)};
  document.querySelectorAll('.slots').forEach(s=>s.innerHTML='');
  figs=[];
  for(let i=0;i<d.E+d.R;i++){
    const el=document.createElement('div');el.className='f';el.innerHTML=svg;
    figs.push({el,ref:i>=d.E,baja:i>=d.E-d.B&&i<d.E});
  }
  const active=figs.filter(f=>!f.baja);
  const hs=new Set();
  for(let j=0;j<d.H;j++) hs.add(Math.min(d.A-1,Math.floor((j+.5)*d.A/d.H)));
  active.forEach((f,k)=>f.huelga=hs.has(k));
  const present=active.filter(f=>!f.huelga);
  present.forEach((f,k)=>{f.min=k<D.Mreal;f.ord=k>=D.Mreal;});
}

function steps(){
  const {E,B,R,A,M,H,P,Mreal,O}=D;
  const odd=E%2===1;
  return [
    {t:'Plantilla estructural: '+E,x:'Son los carteros de plantilla asignados a la unidad.'},
    {t:'De baja: '+B,x:B?'No están disponibles y pasan a la franja de bajas.':'No hay nadie de baja.'},
    {t:'Refuerzos: '+R,x:R?'Cubren las bajas y se suman a la unidad.':'No hay refuerzos.'},
    {t:'Plantilla activa',f:E+' − '+B+' + '+R+' = '+A,x:'Es la gente con la que cuenta realmente la unidad.'},
    {t:'Servicios mínimos',f:E+' ÷ 2 = '+M,x:'Se calcula sobre la plantilla estructural, incluidas las bajas. Los refuerzos no cuentan.'+(odd?' La mitad de '+E+' es '+(E/2).toString().replace('.',',')+': se redondea hacia arriba.':'')},
    {t:'Día de huelga: '+H+(H===1?' la secunda':' la secundan'),x:'Se presentan '+P+'. Los mínimos siguen siendo '+M+'.'},
    {t:Mreal+' a servicios mínimos',x:Mreal<M?'Solo hay '+P+' presentes: faltan '+(M-P)+' para cubrir los mínimos.':'Solo reparten notificaciones electorales. Si no hay, no hacen otra tarea.',w:Mreal<M},
    {t:O+' no huelguistas',x:O?'Asumen el trabajo ordinario de la unidad.':'No queda nadie para el trabajo ordinario.'},
    {t:'Resumen',f:'Mínimos = '+E+' ÷ 2 = '+M,x:'Activos: '+A+'. Mínimos: '+M+'. En huelga: '+H+'. Trabajo ordinario: '+O+'.'}
  ];
}

function zoneFor(f,s){
  if(s>=1&&f.baja) return ['z-baja','baja'];
  if(s>=5&&f.huelga) return ['z-hue','huelga'];
  if(s>=6&&f.min) return ['z-min','min'];
  if(s>=7&&f.ord) return ['z-ord','ord'];
  return ['z-pool',f.ref?'ref':''];
}

function render(){
  const s=cur, st=steps()[s];
  const first=new Map(figs.map(f=>[f,f.el.isConnected&&!f.el.classList.contains('hidden')?f.el.getBoundingClientRect():null]));
  const counts={};
  figs.forEach(f=>{
    const [z,cls]=zoneFor(f,s);
    const hidden=f.ref&&s<2;
    f.el.className='f'+(cls?' '+cls:'')+(hidden?' hidden':'');
    $(z).querySelector('.slots').appendChild(f.el);
    if(!hidden) counts[z]=(counts[z]||0)+1;
  });
  $('z-pool').classList.toggle('off',!counts['z-pool']);
  $('z-baja').classList.toggle('off',!(s>=1&&D.B));
  $('z-hue').classList.toggle('off',!(s>=5&&D.H));
  $('z-min').classList.toggle('off',s<6);
  $('z-ord').classList.toggle('off',s<7);
  if(!reduce) figs.forEach(f=>{
    if(f.el.classList.contains('hidden')) return;
    const a=first.get(f), b=f.el.getBoundingClientRect();
    if(!a) f.el.animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'none'}],{duration:450,easing:'ease-out'});
    else if(a.left!==b.left||a.top!==b.top) f.el.animate([{transform:'translate('+(a.left-b.left)+'px,'+(a.top-b.top)+'px)'},{transform:'none'}],{duration:650,easing:'ease'});
  });
  const n=steps().length;
  $('step').textContent='Paso '+(s+1)+' de '+n;
  $('title').textContent=st.t;
  $('formula').hidden=!st.f;$('formula').textContent=st.f||'';
  $('txt').textContent=st.x;$('txt').classList.toggle('warn',!!st.w);
  $('prev').disabled=s===0;
  $('next').textContent=s===n-1?'Volver a empezar':'Siguiente';
}

$('start').onclick=()=>{
  const d=read();
  if(d.err){$('err').textContent=d.err;return;}
  setup(d);cur=0;
  $('formView').hidden=true;$('animView').hidden=false;
  figs.forEach(f=>f.el.className='f');
  render();
};
$('prev').onclick=()=>{if(cur>0){cur--;render();}};
$('next').onclick=()=>{cur=cur===steps().length-1?0:cur+1;render();};
$('edit').onclick=()=>{$('animView').hidden=true;$('formView').hidden=false;};
document.addEventListener('keydown',e=>{
  if($('animView').hidden) return;
  if(e.key==='ArrowRight')$('next').click();
  if(e.key==='ArrowLeft')$('prev').click();
});
read();
</script>
</body>
</html>
